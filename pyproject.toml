[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-local"
version = "0.8.3"
description = "Local document library for Notepad3"
requires-python = ">=3.13,<3.15"
dependencies = ["wxPython==4.2.5", "watchdog>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "pyinstaller>=6.15,<7", "pip-tools>=7.5"]

[project.gui-scripts]
notes = "notes.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
